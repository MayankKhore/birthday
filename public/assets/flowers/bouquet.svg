<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Colorful flower bouquet with pink and purple blooms">
  <defs>
    <filter id="flowerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Wrapping paper -->
  <path d="M 100 260 L 150 220 L 200 260 Q 200 280 150 280 Q 100 280 100 260 Z" fill="#F3C5D7" filter="url(#flowerShadow)"/>
  <path d="M 150 220 L 120 260 L 180 260 L 150 220 Z" fill="#DFD8F3" opacity="0.8"/>
  
  <!-- Ribbon on wrap -->
  <path d="M 150 220 L 150 240" stroke="#F472B6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 145 242 L 150 246 L 155 242" fill="#F472B6"/>
  
  <!-- Stems and leaves -->
  <path d="M 130 220 Q 130 160 130 120" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  <path d="M 170 220 Q 170 150 170 110" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  <path d="M 150 220 Q 150 180 150 140" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  
  <path d="M 130 160 Q 100 150 110 130" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  <path d="M 170 150 Q 200 140 190 120" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  <path d="M 150 180 Q 120 190 130 170" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Leaves -->
  <ellipse cx="105" cy="145" rx="12" ry="6" fill="#22C55E" transform="rotate(-30 105 145)"/>
  <ellipse cx="195" cy="135" rx="12" ry="6" fill="#22C55E" transform="rotate(30 195 135)"/>
  <ellipse cx="125" cy="175" rx="10" ry="5" fill="#22C55E" transform="rotate(-15 125 175)"/>
  
  <!-- Pink flower (large) -->
  <circle cx="130" cy="110" r="20" fill="#F472B6" filter="url(#flowerShadow)"/>
  <circle cx="115" cy="105" r="14" fill="#F472B6" opacity="0.9"/>
  <circle cx="145" cy="100" r="14" fill="#F472B6" opacity="0.9"/>
  <circle cx="130" cy="90" r="14" fill="#F472B6" opacity="0.9"/>
  <circle cx="130" cy="110" r="8" fill="#FCD34D"/>
  
  <!-- Purple flower -->
  <circle cx="170" cy="110" r="18" fill="#A78BFA" filter="url(#flowerShadow)"/>
  <circle cx="158" cy="105" r="12" fill="#A78BFA" opacity="0.9"/>
  <circle cx="182" cy="100" r="12" fill="#A78BFA" opacity="0.9"/>
  <circle cx="170" cy="92" r="12" fill="#A78BFA" opacity="0.9"/>
  <circle cx="170" cy="110" r="7" fill="#FCD34D"/>
  
  <!-- Small white flowers -->
  <circle cx="110" cy="140" r="6" fill="#F8FAFC" opacity="0.9"/>
  <circle cx="115" cy="132" r="5" fill="#F8FAFC" opacity="0.9"/>
  <circle cx="190" cy="140" r="6" fill="#F8FAFC" opacity="0.9"/>
  <circle cx="185" cy="132" r="5" fill="#F8FAFC" opacity="0.9"/>
</svg>