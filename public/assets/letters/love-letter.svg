<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" role="img" aria-label="Decorative birthday letter with floral border">
  <defs>
    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Letter paper -->
  <rect x="30" y="40" width="280" height="180" rx="12" fill="#FBF2E7" filter="url(#letterShadow)"/>
  
  <!-- Decorative border corners -->
  <path d="M 30 40 Q 45 40 45 55" fill="none" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 30 40 Q 30 55 45 55" fill="none" stroke="#C3BDEC" stroke-width="3" stroke-linecap="round"/>
  <path d="M 310 40 Q 295 40 295 55" fill="none" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 310 40 Q 310 55 295 55" fill="none" stroke="#C3BDEC" stroke-width="3" stroke-linecap="round"/>
  <path d="M 30 220 Q 45 220 45 205" fill="none" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 30 220 Q 30 205 45 205" fill="none" stroke="#C3BDEC" stroke-width="3" stroke-linecap="round"/>
  <path d="M 310 220 Q 295 220 295 205" fill="none" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 310 220 Q 310 205 295 205" fill="none" stroke="#C3BDEC" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Floral corner decorations -->
  <g transform="translate(45, 50)">
    <circle cx="0" cy="0" r="4" fill="#EC4899"/>
    <circle cx="6" cy="2" r="3" fill="#FCD34D"/>
    <circle cx="-6" cy="2" r="3" fill="#3B82F6"/>
  </g>
  <g transform="translate(295, 50)" scale="-1 1">
    <circle cx="0" cy="0" r="4" fill="#EC4899"/>
    <circle cx="6" cy="2" r="3" fill="#FCD34D"/>
    <circle cx="-6" cy="2" r="3" fill="#3B82F6"/>
  </g>
  <g transform="translate(45, 210)" scale="1 -1">
    <circle cx="0" cy="0" r="4" fill="#EC4899"/>
    <circle cx="6" cy="2" r="3" fill="#FCD34D"/>
    <circle cx="-6" cy="2" r="3" fill="#3B82F6"/>
  </g>
  <g transform="translate(295, 210)" scale="-1 -1">
    <circle cx="0" cy="0" r="4" fill="#EC4899"/>
    <circle cx="6" cy="2" r="3" fill="#FCD34D"/>
    <circle cx="-6" cy="2" r="3" fill="#3B82F6"/>
  </g>
  
  <!-- Heart seal top center -->
  <path d="M 168 48 Q 164 44 168 42 Q 172 42 176 44 Q 180 48 176 52 Q 172 56 168 52 Z" fill="#F472B6"/>
  
  <!-- Letter content -->
  <rect x="70" y="80" width="200" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="70" y="94" width="180" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="70" y="108" width="140" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="70" y="126" width="160" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="70" y="140" width="120" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="70" y="156" width="100" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="70" y="172" width="80" height="4" rx="2" fill="#E2E8F0"/>
</svg>