<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Polaroid photo frame placeholder">
  <defs>
    <filter id="photoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DFD8F3"/>
      <stop offset="100%" stop-color="#C3BDEC"/>
    </linearGradient>
  </defs>
  
  <!-- Polaroid frame -->
  <rect x="20" y="20" width="160" height="200" rx="8" fill="#FBF2E7" filter="url(#photoShadow)"/>
  <rect x="30" y="30" width="140" height="140" rx="4" fill="url(#photoGrad)"/>
  <rect x="30" y="172" width="140" height="38" rx="2" fill="#FBF2E7"/>
  
  <!-- Photo content placeholder -->
  <rect x="40" y="40" width="120" height="120" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#F472B6" stroke-width="3" opacity="0.5"/>
  <path d="M 100 70 Q 100 85 100 100 Q 100 115 100 100 Z" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
  
  <!-- Heart decoration bottom -->
  <path d="M 95 195 Q 90 190 95 185 Q 100 185 Q 105 185 Q 110 190 Q 105 195 Q 100 200 Z" fill="#F472B6"/>
  
  <!-- Camera icon -->
  <circle cx="160" y="205" r="6" fill="#CBD5E1"/>
</svg>