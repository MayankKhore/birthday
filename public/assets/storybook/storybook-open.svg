<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Open storybook with castle illustration">
  <defs>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Book cover -->
  <path d="M 40 40 L 360 40 Q 380 40 380 60 L 380 220 Q 380 240 360 240 L 40 240 Q 20 240 20 220 L 20 60 Q 20 40 40 40 Z" fill="#C3BDEC" filter="url(#bookShadow)"/>
  <rect x="40" y="40" width="320" height="20" rx="4" fill="#A78BFA"/>
  <rect x="40" y="220" width="320" height="20" rx="4" fill="#A78BFA"/>
  
  <!-- Book spine -->
  <path d="M 40 60 Q 20 60 20 220 Q 20 240 40 240 L 40 60 Z" fill="#94A3B8"/>
  
  <!-- Left page -->
  <path d="M 60 60 L 200 40 Q 220 40 220 60 L 220 220 Q 220 240 200 240 L 60 240 Q 40 240 40 220 L 40 60 Z" fill="#FBF2E7" filter="url(#bookShadow)"/>
  
  <!-- Right page -->
  <path d="M 220 60 L 360 40 Q 380 40 380 60 L 380 220 Q 380 240 360 240 L 220 240 Q 200 240 200 220 L 200 60 Z" fill="#FBF2E7" filter="url(#bookShadow)"/>
  
  <!-- Page lines left -->
  <rect x="80" y="90" width="100" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="80" y="104" width="90" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="80" y="118" width="70" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="80" y="136" width="80" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="80" y="152" width="60" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="80" y="168" width="50" height="4" rx="2" fill="#E2E8F0"/>
  
  <!-- Page lines right -->
  <rect x="240" y="90" width="100" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="240" y="104" width="110" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="240" y="118" width="90" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="240" y="136" width="100" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="240" y="152" width="80" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="240" y="168" width="70" height="4" rx="2" fill="#E2E8F0"/>
  
  <!-- Castle illustration on left page -->
  <g transform="translate(100, 140)" scale="0.6">
    <rect x="20" y="40" width="30" height="40" fill="#DFD8F3"/>
    <rect x="70" y="40" width="30" height="40" fill="#DFD8F3"/>
    <rect x="35" y="60" width="60" height="20" fill="#DFD8F3"/>
    <polygon points="20,40 35,20 50,40" fill="#C3BDEC"/>
    <polygon points="70,40 85,20 100,40" fill="#C3BDEC"/>
    <circle cx="35" cy="65" r="3" fill="#F472B6"/>
    <circle cx="85" cy="65" r="3" fill="#F472B6"/>
    <path d="M 45 80 Q 50 85 55 80" fill="none" stroke="#FCD34D" stroke-width="2"/>
  </g>
  
  <!-- Moon and stars on right page -->
  <path d="M 280 80 Q 290 70 300 80 Q 290 90 280 80 Z" fill="#FCD34D"/>
  <path d="M 320 60 L 325 65 L 331 65 L 327 69 L 329 73 L 325 70 L 321 73 L 323 69 L 319 65 L 325 65 Z" fill="#FCD34D"/>
  <path d="M 350 90 L 355 95 L 361 95 L 357 99 L 359 103 L 355 100 L 351 103 L 353 99 L 349 95 L 355 95 Z" fill="#FCD34D"/>
  
  <!-- Bookmark ribbon -->
  <path d="M 200 40 L 210 80 L 200 120 L 190 80 Z" fill="#F472B6"/>
</svg>