<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Floating heart decorations in pink and purple">
  <defs>
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Large pink heart -->
  <path d="M 80 100 Q 60 80 60 100 Q 60 120 80 140 Q 100 160 120 140 Q 140 120 140 100 Q 140 80 120 60 Q 100 40 80 60 Z" fill="#FB7185" filter="url(#heartShadow)"/>
  
  <!-- Medium purple heart -->
  <path d="M 200 60 Q 180 40 180 60 Q 180 80 200 100 Q 220 120 240 100 Q 260 80 260 60 Q 260 40 240 20 Q 220 0 200 20 Z" fill="#A78BFA" filter="url(#heartShadow)" opacity="0.9"/>
  
  <!-- Small coral heart -->
  <path d="M 320 120 Q 305 105 305 120 Q 305 135 320 150 Q 335 165 350 150 Q 365 135 365 120 Q 365 105 350 90 Q 335 75 320 90 Z" fill="#F97316" filter="url(#heartShadow)" opacity="0.85"/>
  
  <!-- Tiny hearts -->
  <path d="M 50 160 Q 45 152 45 160 Q 45 168 50 175 Q 55 182 60 175 Q 65 168 65 160 Q 65 152 55 160 Z" fill="#F472B6" opacity="0.7"/>
  <path d="M 260 170 Q 255 162 255 170 Q 255 178 260 185 Q 265 192 270 185 Q 275 178 275 170 Q 275 162 265 170 Z" fill="#FB7185" opacity="0.6"/>
  <path d="M 340 80 Q 335 72 335 80 Q 335 88 340 95 Q 345 102 350 95 Q 355 88 355 80 Q 355 72 345 80 Z" fill="#A78BFA" opacity="0.7"/>
  <path d="M 140 150 Q 135 142 135 150 Q 135 158 140 165 Q 145 172 150 165 Q 155 158 155 150 Q 155 142 145 150 Z" fill="#C3BDEC" opacity="0.8"/>
</svg>