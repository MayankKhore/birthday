<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img" aria-label="Open envelope revealing letter inside">
  <defs>
    <linearGradient id="envBodyOpen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C3BDEC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="envShadowOpen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Envelope back flap (open) -->
  <path d="M 30 80 L 150 20 L 270 80 L 150 140 Z" fill="url(#envBodyOpen)" filter="url(#envShadowOpen)"/>
  <path d="M 30 80 L 150 140 L 270 80 Z" fill="url(#envBodyOpen)" filter="url(#envShadowOpen)"/>
  
  <!-- Fold lines -->
  <path d="M 30 80 L 150 20" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 150 20 L 270 80" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 150 20 L 150 140" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Letter paper -->
  <rect x="50" y="90" width="200" height="140" rx="6" fill="#FBF2E7" filter="url(#envShadowOpen)"/>
  <rect x="50" y="90" width="200" height="12" rx="2" fill="rgba(0,0,0,0.05)"/>
  
  <!-- Letter content lines -->
  <rect x="70" y="120" width="160" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="70" y="132" width="140" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="70" y="144" width="100" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="70" y="160" width="120" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="70" y="172" width="90" height="4" rx="2" fill="#E2E8F0"/>
  
  <!-- Heart accent on letter -->
  <path d="M 230 150 Q 225 145 225 155 Q 225 165 235 175 Q 245 165 245 155 Q 245 145 240 150 Q 235 155 230 150 Z" fill="#F472B6" opacity="0.9"/>
</svg>