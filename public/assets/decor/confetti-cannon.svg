<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Party confetti cannon with streamers">
  <defs>
    <filter id="cannonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Cannon body -->
  <rect x="60" y="80" width="80" height="40" rx="8" fill="#C3BDEC" filter="url(#cannonShadow)"/>
  <rect x="60" y="80" width="80" height="8" rx="2" fill="#A78BFA"/>
  <circle cx="145" cy="100" r="8" fill="#E0A428"/>
  
  <!-- Streamers -->
  <path d="M 100 70 Q 110 30 120 10" fill="none" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 105 70 Q 115 20 130 0" fill="none" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>
  <path d="M 95 70 Q 105 25 115 5" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 70 Q 110 40 118 15" fill="none" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Confetti pieces -->
  <rect x="115" y="20" width="6" height="10" rx="2" fill="#F472B6" transform="rotate(15 118 25)"/>
  <rect x="125" y="10" width="8" height="6" rx="2" fill="#FB7185" transform="rotate(-15 129 13)"/>
  <rect x="105" y="30" width="6" height="10" rx="2" fill="#A78BFA" transform="rotate(25 108 35)"/>
  <rect x="135" y="5" width="10" height="6" rx="2" fill="#FCD34D" transform="rotate(-10 140 8)"/>
  <rect x="110" y="45" width="6" height="10" rx="2" fill="#F472B6" transform="rotate(20 113 50)"/>
</svg>