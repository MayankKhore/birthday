<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" aria-label="Floral birthday card">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDF7F2"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Card base -->
  <rect x="40" y="40" width="720" height="920" rx="24" fill="url(#cardGrad)" stroke="#E8DCCF" stroke-width="2" filter="url(#cardShadow)"/>
  
  <!-- Inner border -->
  <rect x="60" y="60" width="680" height="880" rx="18" fill="none" stroke="#F4E6D8" stroke-width="1"/>
  
  <!-- Top-left floral -->
  <g transform="translate(70, 70)">
    <path d="M0,0 Q-30,-40 -60,0 Q-30,40 0,0" fill="none" stroke="#C9A9A0" stroke-width="2"/>
    <ellipse cx="-20" cy="-15" rx="12" ry="8" fill="#F4C2B2" opacity="0.8"/>
    <circle cx="-28" cy="-8" r="3" fill="#E8A59A"/>
    <path d="M-10,10 Q-40,20 -50,60 Q-40,100 -10,120" fill="none" stroke="#9FAE9E" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-35" cy="60" rx="10" ry="6" fill="#D4E4D2" opacity="0.7"/>
  </g>
  
  <!-- Top-right floral -->
  <g transform="translate(650, 70)">
    <path d="M0,0 Q30,-40 60,0 Q30,40 0,0" fill="none" stroke="#C9A9A0" stroke-width="2"/>
    <ellipse cx="20" cy="-15" rx="12" ry="8" fill="#F4C2B2" opacity="0.8"/>
    <circle cx="28" cy="-8" r="3" fill="#E8A59A"/>
    <path d="M10,10 Q40,20 50,60 Q40,100 10,120" fill="none" stroke="#9FAE9E" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="35" cy="60" rx="10" ry="6" fill="#D4E4D2" opacity="0.7"/>
  </g>
  
  <!-- Bottom-left floral -->
  <g transform="translate(70, 840)">
    <path d="M0,0 Q-30,40 -60,0 Q-30,-40 0,0" fill="none" stroke="#C9A9A0" stroke-width="2"/>
    <ellipse cx="-20" cy="15" rx="12" ry="8" fill="#F4C2B2" opacity="0.8"/>
    <path d="M-10,-10 Q-40,-20 -50,-60 Q-40,-100 -10,-120" fill="none" stroke="#9FAE9E" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-35" cy="-60" rx="10" ry="6" fill="#D4E4D2" opacity="0.7"/>
  </g>
  
  <!-- Bottom-right floral -->
  <g transform="translate(650, 840)">
    <path d="M0,0 Q30,40 60,0 Q30,-40 0,0" fill="none" stroke="#C9A9A0" stroke-width="2"/>
    <ellipse cx="20" cy="15" rx="12" ry="8" fill="#F4C2B2" opacity="0.8"/>
    <path d="M10,-10 Q40,-20 50,-60 Q40,-100 10,-120" fill="none" stroke="#9FAE9E" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="35" cy="-60" rx="10" ry="6" fill="#D4E4D2" opacity="0.7"/>
  </g>
  
  <!-- Central bouquet -->
  <g transform="translate(400, 420)">
    <circle cx="0" cy="0" r="26" fill="#F4C2B2"/>
    <circle cx="-14" cy="-9" r="13" fill="#F4C2B2" opacity="0.9"/>
    <circle cx="14" cy="-9" r="13" fill="#F4C2B2" opacity="0.9"/>
    <circle cx="-9" cy="14" r="13" fill="#F4C2B2" opacity="0.9"/>
    <circle cx="9" cy="14" r="13" fill="#F4C2B2" opacity="0.9"/>
    <circle cx="0" cy="0" r="10" fill="#E8A59A"/>
    <circle cx="0" cy="0" r="6" fill="#C9A9A0"/>
    <path d="M0,0 Q-60,-20 -90,20 Q-50,60 0,40" fill="#9FAE9E" opacity="0.8"/>
    <path d="M0,0 Q60,-20 90,20 Q50,60 0,40" fill="#9FAE9E" opacity="0.8"/>
  </g>
  
  <!-- Secondary blooms -->
  <g transform="translate(140, 560)">
    <circle cx="0" cy="0" r="18" fill="#E8DCCF" opacity="0.9"/>
    <circle cx="-9" cy="-7" r="9" fill="#E8DCCF" opacity="0.8"/>
    <circle cx="9" cy="-7" r="9" fill="#E8DCCF" opacity="0.8"/>
    <circle cx="0" cy="0" r="7" fill="#D4C9B8"/>
    <path d="M0,-9 Q-22,-22 -32,0 Q-22,22 0,9" fill="none" stroke="#9FAE9E" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(660, 560)">
    <circle cx="0" cy="0" r="18" fill="#E8DCCF" opacity="0.9"/>
    <circle cx="-9" cy="-7" r="9" fill="#E8DCCF" opacity="0.8"/>
    <circle cx="9" cy="-7" r="9" fill="#E8DCCF" opacity="0.8"/>
    <circle cx="0" cy="0" r="7" fill="#D4C9B8"/>
    <path d="M0,-9 Q22,-22 32,0 Q22,22 0,9" fill="none" stroke="#9FAE9E" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Stem -->
  <path d="M400,446 Q400,500 400,560" fill="none" stroke="#9FAE9E" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Falling petals -->
  <ellipse cx="110" cy="720" rx="6" ry="3" fill="#F4C2B2" opacity="0.6" transform="rotate(-15 110 720)"/>
  <ellipse cx="690" cy="760" rx="6" ry="3" fill="#F4C2B2" opacity="0.6" transform="rotate(15 690 760)"/>
  
  <!-- Cake area -->
  <rect x="570" y="720" width="190" height="190" rx="14" fill="#F4EDE5" stroke="#E8DCCF" stroke-width="1"/>
  
  <!-- Sparkles -->
  <circle cx="200" cy="300" r="2" fill="#F4E6D8" opacity="0.8"/>
  <circle cx="600" cy="300" r="2" fill="#F4E6D8" opacity="0.8"/>
  <circle cx="500" cy="800" r="1.5" fill="#F4E6D8" opacity="0.6"/>
</svg>