<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-label="Birthday cake with candle">
  <defs>
    <radialGradient id="flameGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF5E0"/>
      <stop offset="60%" stop-color="#F07868"/>
      <stop offset="100%" stop-color="#2B1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Cake plate -->
  <ellipse cx="100" cy="165" rx="45" ry="12" fill="#E8DCCF" opacity="0.9"/>
  <ellipse cx="100" cy="160" rx="42" ry="8" fill="#F4EDE5"/>
  
  <!-- Cake base -->
  <rect x="60" y="100" width="80" height="65" rx="10" fill="#F4C2B2"/>
  <rect x="55" y="95" width="90" height="5" rx="2" fill="#E8A59A"/>
  
  <!-- Cake middle -->
  <rect x="65" y="80" width="70" height="25" rx="8" fill="#F4EDE5"/>
  
  <!-- Cake top -->
  <rect x="70" y="70" width="60" height="15" rx="6" fill="#F4C2B2"/>
  <path d="M70,70 Q100,55 130,70 Q115,80 100,80 Q85,80 70,70" fill="none" stroke="#E8A59A" stroke-width="1.5"/>
  
  <!-- Candle -->
  <rect x="94" y="45" width="12" height="30" rx="2" fill="#FFFFFF" stroke="#E8DCCF" stroke-width="0.5"/>
  <ellipse cx="100" cy="45" rx="6" ry="3" fill="#F4EDE5"/>
  
  <!-- Flame -->
  <ellipse cx="100" cy="40" rx="7" ry="10" fill="url(#flameGrad)"/>
  
  <!-- Candle drip -->
  <path d="M94,45 Q100,55 106,45" fill="none" stroke="#F4C2B2" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Sprinkles -->
  <rect x="88" y="78" width="3" height="3" fill="#C9A9A0" opacity="0.7"/>
  <rect x="109" y="78" width="3" height="3" fill="#F4C2B2" opacity="0.7"/>
  <rect x="98" y="86" width="3" height="3" fill="#9FAE9E" opacity="0.7"/>
  <rect x="119" y="86" width="3" height="3" fill="#E8A59A" opacity="0.7"/>
</svg>